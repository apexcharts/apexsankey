<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparison Split-view - Sankey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="../apexsankey.min.js"></script>
    <style>
      body {
        max-width: 1100px;
        margin: 0 auto;
        font-family: 'Inter', sans-serif;
        background: #fff;
        padding: 20px 0;
      }
      h2 {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin: 0 0 4px 0;
        line-height: 1.3;
      }
      .subtitle {
        font-size: 13px;
        color: #6e6e6e;
        margin-bottom: 16px;
      }
      code {
        background: #f1f5f9;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Comparison Split-view &mdash; 2024 vs 2025</h2>
    <p class="subtitle">
      Two diagrams of the same flow model, side by side. Each flow is outlined by how it changed between the years
      (added, removed, or changed), and hovering a node highlights the same node in the other panel. One call:
      <code>ApexSankey.compare(el, {before, after})</code>.
    </p>
    <div id="svg-sankey"></div>
    <script>
      const palette = {
        Coal: '#78716c',
        Gas: '#f59e0b',
        Oil: '#a16207',
        Solar: '#eab308',
        Wind: '#38bdf8',
        Nuclear: '#a855f7',
        Grid: '#6366f1',
        Homes: '#10b981',
        Industry: '#ec4899',
      };
      const node = (id) => ({id, title: id, color: palette[id]});

      // 2024: an Oil plant still feeds the grid; no nuclear yet.
      const before = {
        title: '2024',
        nodes: ['Coal', 'Gas', 'Oil', 'Solar', 'Wind', 'Grid', 'Homes', 'Industry'].map(node),
        edges: [
          {source: 'Coal', target: 'Grid', value: 220, type: 'in'},
          {source: 'Gas', target: 'Grid', value: 180, type: 'in'},
          {source: 'Oil', target: 'Grid', value: 70, type: 'in'},
          {source: 'Solar', target: 'Grid', value: 90, type: 'in'},
          {source: 'Wind', target: 'Grid', value: 110, type: 'in'},
          {source: 'Grid', target: 'Homes', value: 320, type: 'out'},
          {source: 'Grid', target: 'Industry', value: 350, type: 'out'},
        ],
      };

      // 2025: Oil is retired (removed), Nuclear comes online (added), coal drops
      // sharply and solar/wind grow (changed); gas holds steady (unchanged).
      const after = {
        title: '2025',
        nodes: ['Coal', 'Gas', 'Solar', 'Wind', 'Nuclear', 'Grid', 'Homes', 'Industry'].map(node),
        edges: [
          {source: 'Coal', target: 'Grid', value: 90, type: 'in'}, // changed (down)
          {source: 'Gas', target: 'Grid', value: 180, type: 'in'}, // unchanged
          {source: 'Solar', target: 'Grid', value: 190, type: 'in'}, // changed (up)
          {source: 'Wind', target: 'Grid', value: 180, type: 'in'}, // changed (up)
          {source: 'Nuclear', target: 'Grid', value: 120, type: 'in'}, // added
          {source: 'Grid', target: 'Homes', value: 380, type: 'out'}, // changed (up)
          {source: 'Grid', target: 'Industry', value: 350, type: 'out'}, // unchanged
        ],
      };

      ApexSankey.compare(document.getElementById('svg-sankey'), {
        before,
        after,
        options: {
          height: 420,
          fontFamily: 'Inter, sans-serif',
          fontWeight: '500',
          fontSize: '12px',
          fontColor: '#334155',
          enableToolbar: false,
          canvasStyle: 'border: 1px solid #e2e8f0; border-radius: 8px; background: #fafafa; box-sizing: border-box;',
        },
      });
    </script>
  </body>
</html>
