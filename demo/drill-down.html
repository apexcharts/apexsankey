<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drill-down - Sankey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="../apexsankey.min.js"></script>
    <style>
      body {
        max-width: 1000px;
        margin: 0 auto;
        font-family: 'Inter', sans-serif;
        background: #fff;
        padding: 20px 0;
      }
      h2 {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin: 0 0 4px 0;
        line-height: 1.3;
      }
      .subtitle {
        font-size: 13px;
        color: #6e6e6e;
        margin-bottom: 16px;
      }
      code {
        background: #f1f5f9;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Drill-down &amp; Node Aggregation</h2>
    <p class="subtitle">
      Click <strong>Fossil</strong> or <strong>Renewable</strong> to expand it into its sources; click any source to
      collapse it back. Each transition morphs through the chart's own <code>update()</code>. A plugin
      (<code>use(ApexSankey.plugins.drillDown())</code>) drives it on top of the pure
      <code>ApexSankey.collapseGroups()</code> transform.
    </p>
    <div id="svg-sankey"></div>
    <script>
      // The full, detailed graph: every energy source down to the leaf.
      const detail = {
        nodes: [
          {id: 'Coal', title: 'Coal', color: '#78716c'},
          {id: 'Gas', title: 'Gas', color: '#f59e0b'},
          {id: 'Oil', title: 'Oil', color: '#a16207'},
          {id: 'Solar', title: 'Solar', color: '#eab308'},
          {id: 'Wind', title: 'Wind', color: '#38bdf8'},
          {id: 'Hydro', title: 'Hydro', color: '#0ea5e9'},
          {id: 'Grid', title: 'Grid', color: '#6366f1'},
          {id: 'Homes', title: 'Homes', color: '#10b981'},
          {id: 'Industry', title: 'Industry', color: '#ec4899'},
        ],
        edges: [
          {source: 'Coal', target: 'Grid', value: 180, type: 'fossil'},
          {source: 'Gas', target: 'Grid', value: 140, type: 'fossil'},
          {source: 'Oil', target: 'Grid', value: 60, type: 'fossil'},
          {source: 'Solar', target: 'Grid', value: 120, type: 'renewable'},
          {source: 'Wind', target: 'Grid', value: 150, type: 'renewable'},
          {source: 'Hydro', target: 'Grid', value: 90, type: 'renewable'},
          {source: 'Grid', target: 'Homes', value: 380, type: 'demand'},
          {source: 'Grid', target: 'Industry', value: 360, type: 'demand'},
        ],
      };

      // The super-nodes: each hides a set of sources until you expand it.
      const groups = [
        {id: 'Fossil', title: 'Fossil', color: '#57534e', children: ['Coal', 'Gas', 'Oil']},
        {id: 'Renewable', title: 'Renewable', color: '#0d9488', children: ['Solar', 'Wind', 'Hydro']},
      ];

      const s = new ApexSankey(document.getElementById('svg-sankey'), {
        width: '100%',
        height: 480,
        fontFamily: 'Inter, sans-serif',
        fontWeight: '500',
        fontSize: '12px',
        fontColor: '#334155',
        canvasStyle: 'border: 1px solid #e2e8f0; border-radius: 8px; background: #fafafa; box-sizing: border-box;',
      });

      // Seed with everything collapsed, then let the plugin take over.
      s.render({...ApexSankey.collapseGroups(detail, groups, ['Fossil', 'Renewable']), options: s.options});
      s.use(ApexSankey.plugins.drillDown({...detail, groups}));
    </script>
  </body>
</html>
