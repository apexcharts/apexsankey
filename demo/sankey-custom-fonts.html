<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Fonts - Job Application Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Satisfy&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="../apexsankey.min.js"></script>
    <style>
      body {
        max-width: 1000px;
        margin: 0 auto;
        font-family: 'Inter', sans-serif;
        background: #fff;
        padding: 20px 0;
      }
      h2 {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin: 0 0 4px 0;
        line-height: 1.3;
      }
      .subtitle {
        font-size: 13px;
        color: #888;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h2>Job Application Journey</h2>
    <p class="subtitle">
      Custom Google Font with warm accent color (<code>fontFamily: 'Satisfy'</code>, <code>fontColor: '#B45309'</code>,
      <code>fontSize: '18px'</code>) and column ordering via
      <code>data.options.order</code>
    </p>
    <div id="svg-sankey"></div>
    <script>
      const data = {
        nodes: [
          {id: 'LinkedIn', title: 'LinkedIn', color: '#0A66C2'},
          {id: 'Indeed', title: 'Indeed', color: '#2164F3'},
          {id: 'Referral', title: 'Referral', color: '#7C3AED'},
          {id: 'Company Site', title: 'Company Site', color: '#0891B2'},
          {id: 'Recruiter', title: 'Recruiter', color: '#059669'},
          {id: 'Applied', title: 'Applied', color: '#D97706'},
          {id: 'No Response', title: 'No Response', color: '#D4D4D8'},
          {id: 'Responded', title: 'Responded', color: '#F59E0B'},
          {id: 'Rejected', title: 'Rejected', color: '#A3A3A3'},
          {id: 'Interviewed', title: 'Interviewed', color: '#F97316'},
          {id: 'No Offer', title: 'No Offer', color: '#CBD5E1'},
          {id: 'Declined', title: 'Declined', color: '#94A3B8'},
          {id: 'Accepted', title: 'Accepted!', color: '#16A34A'},
        ],
        edges: [
          {source: 'LinkedIn', target: 'Applied', value: 85},
          {source: 'Indeed', target: 'Applied', value: 62},
          {source: 'Referral', target: 'Applied', value: 28},
          {source: 'Company Site', target: 'Applied', value: 40},
          {source: 'Recruiter', target: 'Applied', value: 23},
          {source: 'Applied', target: 'No Response', value: 168},
          {source: 'Applied', target: 'Responded', value: 70},
          {source: 'Responded', target: 'Rejected', value: 48},
          {source: 'Responded', target: 'Interviewed', value: 22},
          {source: 'Interviewed', target: 'No Offer', value: 14},
          {source: 'Interviewed', target: 'Declined', value: 4},
          {source: 'Interviewed', target: 'Accepted', value: 4},
        ],
        options: {
          order: [
            [['LinkedIn', 'Indeed', 'Referral', 'Company Site', 'Recruiter']],
            [['Applied']],
            [['Responded'], ['No Response']],
            [['Interviewed'], ['Rejected']],
            [['Accepted', 'Declined', 'No Offer']],
          ],
        },
      };

      const options = {
        nodeWidth: 12,
        fontSize: '18px',
        fontFamily: 'Satisfy, cursive',
        fontWeight: '400',
        fontColor: '#B45309',
        width: '100%',
        height: 600,
        edgeGradientFill: true,
        edgeOpacity: 0.3,
        enableToolbar: false,
        canvasStyle: 'border: 1px solid #e7e5e4; border-radius: 8px; background: #fffbf5; box-sizing: border-box;',
      };

      const s = new ApexSankey(document.getElementById('svg-sankey'), options);
      s.render(data);
    </script>
  </body>
</html>
