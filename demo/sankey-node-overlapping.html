<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dense Layout - University Course Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="../apexsankey.min.js"></script>
    <style>
      body {
        max-width: 1000px;
        margin: 0 auto;
        font-family: 'Inter', sans-serif;
        background: #fff;
        padding: 20px 0;
      }
      h2 {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin: 0 0 4px 0;
        line-height: 1.3;
      }
      .subtitle {
        font-size: 13px;
        color: #6e6e6e;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h2>University Course Enrollment Flow</h2>
    <p class="subtitle">
      A dense, many-node layout showing student enrollment across departments, courses, and outcomes (<code
        >spacing: 24</code
      >, <code>fontSize: '11px'</code>)
    </p>
    <div id="svg-sankey"></div>
    <script>
      const data = {
        nodes: [
          // Departments
          {id: 'CS', title: 'Computer Science', color: '#3B82F6'},
          {id: 'Math', title: 'Mathematics', color: '#8B5CF6'},
          {id: 'Physics', title: 'Physics', color: '#06B6D4'},
          {id: 'Business', title: 'Business', color: '#F59E0B'},
          {id: 'Biology', title: 'Biology', color: '#10B981'},
          {id: 'English', title: 'English', color: '#EC4899'},
          // Courses — CS
          {id: 'Intro to Programming', title: 'Intro to Programming', color: '#60A5FA'},
          {id: 'Data Structures', title: 'Data Structures', color: '#3B82F6'},
          {id: 'Machine Learning', title: 'Machine Learning', color: '#2563EB'},
          {id: 'Web Development', title: 'Web Development', color: '#1D4ED8'},
          // Courses — Math
          {id: 'Calculus', title: 'Calculus', color: '#A78BFA'},
          {id: 'Linear Algebra', title: 'Linear Algebra', color: '#8B5CF6'},
          {id: 'Statistics', title: 'Statistics', color: '#7C3AED'},
          // Courses — Physics
          {id: 'Mechanics', title: 'Mechanics', color: '#22D3EE'},
          {id: 'Electromagnetism', title: 'Electromagnetism', color: '#06B6D4'},
          // Courses — Business
          {id: 'Accounting', title: 'Accounting', color: '#FBBF24'},
          {id: 'Marketing', title: 'Marketing', color: '#F59E0B'},
          {id: 'Finance', title: 'Finance', color: '#D97706'},
          // Courses — Biology
          {id: 'Cell Biology', title: 'Cell Biology', color: '#34D399'},
          {id: 'Genetics', title: 'Genetics', color: '#10B981'},
          // Courses — English
          {id: 'Creative Writing', title: 'Creative Writing', color: '#F472B6'},
          {id: 'Literature', title: 'Literature', color: '#EC4899'},
          // Outcomes
          {id: 'Graduated', title: 'Graduated', color: '#059669'},
          {id: 'Switched Major', title: 'Switched Major', color: '#F97316'},
          {id: 'Dropped', title: 'Dropped', color: '#94A3B8'},
          {id: 'Honors', title: 'Honors', color: '#7C3AED'},
        ],
        edges: [
          // CS courses
          {source: 'CS', target: 'Intro to Programming', value: 280},
          {source: 'CS', target: 'Data Structures', value: 190},
          {source: 'CS', target: 'Machine Learning', value: 140},
          {source: 'CS', target: 'Web Development', value: 160},
          // Math courses
          {source: 'Math', target: 'Calculus', value: 220},
          {source: 'Math', target: 'Linear Algebra', value: 130},
          {source: 'Math', target: 'Statistics', value: 170},
          // Physics courses
          {source: 'Physics', target: 'Mechanics', value: 150},
          {source: 'Physics', target: 'Electromagnetism', value: 110},
          // Business courses
          {source: 'Business', target: 'Accounting', value: 180},
          {source: 'Business', target: 'Marketing', value: 200},
          {source: 'Business', target: 'Finance', value: 160},
          // Biology courses
          {source: 'Biology', target: 'Cell Biology', value: 140},
          {source: 'Biology', target: 'Genetics', value: 120},
          // English courses
          {source: 'English', target: 'Creative Writing', value: 110},
          {source: 'English', target: 'Literature', value: 90},
          // CS outcomes
          {source: 'Intro to Programming', target: 'Graduated', value: 180},
          {source: 'Intro to Programming', target: 'Switched Major', value: 60},
          {source: 'Intro to Programming', target: 'Dropped', value: 40},
          {source: 'Data Structures', target: 'Graduated', value: 140},
          {source: 'Data Structures', target: 'Honors', value: 30},
          {source: 'Data Structures', target: 'Dropped', value: 20},
          {source: 'Machine Learning', target: 'Graduated', value: 90},
          {source: 'Machine Learning', target: 'Honors', value: 40},
          {source: 'Machine Learning', target: 'Dropped', value: 10},
          {source: 'Web Development', target: 'Graduated', value: 130},
          {source: 'Web Development', target: 'Dropped', value: 30},
          // Math outcomes
          {source: 'Calculus', target: 'Graduated', value: 150},
          {source: 'Calculus', target: 'Switched Major', value: 40},
          {source: 'Calculus', target: 'Dropped', value: 30},
          {source: 'Linear Algebra', target: 'Graduated', value: 90},
          {source: 'Linear Algebra', target: 'Honors', value: 25},
          {source: 'Linear Algebra', target: 'Dropped', value: 15},
          {source: 'Statistics', target: 'Graduated', value: 120},
          {source: 'Statistics', target: 'Switched Major', value: 30},
          {source: 'Statistics', target: 'Dropped', value: 20},
          // Physics outcomes
          {source: 'Mechanics', target: 'Graduated', value: 100},
          {source: 'Mechanics', target: 'Switched Major', value: 30},
          {source: 'Mechanics', target: 'Dropped', value: 20},
          {source: 'Electromagnetism', target: 'Graduated', value: 70},
          {source: 'Electromagnetism', target: 'Honors', value: 25},
          {source: 'Electromagnetism', target: 'Dropped', value: 15},
          // Business outcomes
          {source: 'Accounting', target: 'Graduated', value: 140},
          {source: 'Accounting', target: 'Dropped', value: 40},
          {source: 'Marketing', target: 'Graduated', value: 160},
          {source: 'Marketing', target: 'Switched Major', value: 25},
          {source: 'Marketing', target: 'Dropped', value: 15},
          {source: 'Finance', target: 'Graduated', value: 110},
          {source: 'Finance', target: 'Honors', value: 30},
          {source: 'Finance', target: 'Dropped', value: 20},
          // Biology outcomes
          {source: 'Cell Biology', target: 'Graduated', value: 100},
          {source: 'Cell Biology', target: 'Switched Major', value: 25},
          {source: 'Cell Biology', target: 'Dropped', value: 15},
          {source: 'Genetics', target: 'Graduated', value: 80},
          {source: 'Genetics', target: 'Honors', value: 25},
          {source: 'Genetics', target: 'Dropped', value: 15},
          // English outcomes
          {source: 'Creative Writing', target: 'Graduated', value: 80},
          {source: 'Creative Writing', target: 'Switched Major', value: 20},
          {source: 'Creative Writing', target: 'Dropped', value: 10},
          {source: 'Literature', target: 'Graduated', value: 65},
          {source: 'Literature', target: 'Honors', value: 15},
          {source: 'Literature', target: 'Dropped', value: 10},
        ],
      };

      const options = {
        nodeWidth: 14,
        fontFamily: 'Inter, sans-serif',
        fontWeight: '500',
        fontSize: '11px',
        fontColor: '#334155',
        width: '100%',
        height: 680,
        spacing: 24,
        edgeGradientFill: true,
        edgeOpacity: 0.25,
        enableToolbar: true,
        highlightConnectedPath: true,
        dimOpacity: 0.12,
        canvasStyle: 'border: 1px solid #e2e8f0; border-radius: 8px; background: #fafafa; box-sizing: border-box;',
      };

      const s = new ApexSankey(document.getElementById('svg-sankey'), options);
      s.render(data);
    </script>
  </body>
</html>
